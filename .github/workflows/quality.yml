name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check . --output-format=github
      - name: Ruff format check
        run: ruff format . --check

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install mypy pydantic
      - name: Mypy type check
        run: mypy . --config-file=pyproject.toml
        continue-on-error: true  # Don't block on pre-existing type issues

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt 2>/dev/null || pip install pytest pytest-timeout pytest-asyncio pydantic hypothesis deepeval
      - name: Run tests
        run: pytest tests/ --tb=short -q --ignore=tests/test_global_smoke.py --ignore=tests/test_testing_mode.py -k "not test_notify_action_sends_telegram and not test_plain_text_sends_as_notification and not test_healthy_run and not test_suppression_in_main_flow"

  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install radon
      - name: Complexity gate
        run: python3 scripts/complexity_gate.py --threshold 20 --paths heartbeat.py watcher.py utils/ agents/ novatrade/
        continue-on-error: true  # Report but don't block (threshold 20 is advisory for now)
