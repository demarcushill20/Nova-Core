# Intelligent Dynamic Block Scheduler — Scoring Weights
# All factor weights should sum to ~1.0 for clean normalization
# NOTE: goal_alignment removed — Phase 7+ will add it from dependency graph

scorer:
  # Factor weights for the multi-factor objective function
  weights:
    urgency: 0.30
    strategic_value: 0.25
    unblock_value: 0.25
    risk_reduction: 0.20

  # Priority multipliers (applied to base score)
  priority_multiplier:
    high: 1.3
    medium: 1.0
    low: 0.7

  # Commitment level adjustments
  commitment_bonus:
    hard: 0.15
    soft: 0.0
    opportunistic: -0.10

  # Deferment aging
  aging:
    rate_per_day:
      hard: 1.0
      soft: 0.5
      opportunistic: 0.2
    max_bonus: 30.0  # Cap the aging bonus

  # Confidence modifier
  confidence:
    low_confidence_penalty: 0.3  # Multiply score by this when confidence < 0.3
    high_confidence_bonus: 1.1   # Multiply score by this when confidence > 0.8

  # Duration weight (controls how much uncertainty spread adds to effective time)
  duration_weight: 0.1
