# NovaCore log rotation configuration
# Phase 3.5: Log rotation & monitoring
# Install: sudo cp scripts/novacore-logrotate.conf /etc/logrotate.d/novacore

# Application logs
/home/nova/nova-core/LOGS/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 640 nova nova
    sharedscripts
    postrotate
        # Signal watcher to reopen log handles if needed
        systemctl reload novacore-watcher 2>/dev/null || true
    endscript
}

# Worker logs
/home/nova/nova-core/LOGS/worker_*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 640 nova nova
    size 50M
}

# Audit logs — keep 90 days (regulatory requirement)
/home/nova/nova-core/LOGS/audit/*.jsonl {
    weekly
    rotate 13
    compress
    delaycompress
    missingok
    notifempty
    create 640 nova nova
    sharedscripts
    postrotate
        # Record chain bridge hash for audit continuity
        python3 -c "
import json, hashlib
from pathlib import Path
audit_dir = Path('/home/nova/nova-core/LOGS/audit')
manifest = audit_dir / 'chain_manifest.json'
manifests = json.loads(manifest.read_text()) if manifest.exists() else []
for rotated in sorted(audit_dir.glob('*.jsonl.1')):
    lines = rotated.read_text().strip().splitlines()
    if lines:
        last = json.loads(lines[-1])
        manifests.append({
            'file': rotated.name,
            'last_hash': last.get('chain_hash', ''),
            'entries': len(lines),
            'rotated_at': __import__('datetime').datetime.utcnow().isoformat() + 'Z',
        })
manifest.write_text(json.dumps(manifests, indent=2))
" 2>/dev/null || true
    endscript
}
