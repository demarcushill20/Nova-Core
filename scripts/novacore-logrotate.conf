# NovaCore log rotation configuration
# Phase 3.5: Log rotation & monitoring
# Install: sudo cp scripts/novacore-logrotate.conf /etc/logrotate.d/novacore

# Application logs
#
# copytruncate (task 1049): long-lived processes (the watcher) hold an open
# write fd to these files. The old rename+create scheme left that fd pointing at
# the *renamed* inode (watcher.log.1), which then grew unbounded while the fresh
# watcher.log stayed empty — `notifempty` made every later rotation a no-op.
# The postrotate `systemctl reload` was a dead no-op (the unit has no ExecReload
# and watcher.py installs no SIGHUP handler). copytruncate rotates in place:
# logrotate copies the file then truncates it, so the held fd keeps working and
# the active log can never be orphaned. (The watcher now also self-rotates via a
# RotatingFileHandler — this is the belt-and-suspenders external safety net.)
/home/nova/nova-core/LOGS/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

# Worker logs
/home/nova/nova-core/LOGS/worker_*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 640 nova nova
    size 50M
}

# Audit logs — keep 90 days (regulatory requirement)
/home/nova/nova-core/LOGS/audit/*.jsonl {
    weekly
    rotate 13
    compress
    delaycompress
    missingok
    notifempty
    create 640 nova nova
    sharedscripts
    postrotate
        # Record chain bridge hash for audit continuity
        python3 -c "
import json, hashlib
from pathlib import Path
audit_dir = Path('/home/nova/nova-core/LOGS/audit')
manifest = audit_dir / 'chain_manifest.json'
manifests = json.loads(manifest.read_text()) if manifest.exists() else []
for rotated in sorted(audit_dir.glob('*.jsonl.1')):
    lines = rotated.read_text().strip().splitlines()
    if lines:
        last = json.loads(lines[-1])
        manifests.append({
            'file': rotated.name,
            'last_hash': last.get('chain_hash', ''),
            'entries': len(lines),
            'rotated_at': __import__('datetime').datetime.utcnow().isoformat() + 'Z',
        })
manifest.write_text(json.dumps(manifests, indent=2))
" 2>/dev/null || true
    endscript
}
