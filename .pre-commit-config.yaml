repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
        exclude: '^tests/test_secrets_coverage\.py$'

  - repo: local
    hooks:
      - id: novacore-guardrails
        name: NovaCore guardrails (secrets + artifacts)
        entry: scripts/check-guardrails.sh
        language: script
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        args: [--check]

  - repo: local
    hooks:
      - id: mypy
        name: mypy type check (changed files)
        entry: .venv/bin/mypy --config-file=pyproject.toml --no-error-summary
        language: system
        types: [python]
        require_serial: true
        exclude: '^(\.claude/skills/skill-creator/(scripts|eval-viewer)/|scripts/compliance-report\.py)'
