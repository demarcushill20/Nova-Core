repos:
  - repo: local
    hooks:
      - id: novacore-guardrails
        name: NovaCore guardrails (secrets + artifacts)
        entry: scripts/check-guardrails.sh
        language: script
        pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        args: [--check]
