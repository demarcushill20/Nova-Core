# Phase 6B.15: sd_notify watchdog integration
#
# To install this drop-in override:
#   sudo mkdir -p /etc/systemd/system/novacore-watcher.service.d
#   sudo cp systemd/novacore-watcher.service.d/watchdog.conf \
#       /etc/systemd/system/novacore-watcher.service.d/watchdog.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart novacore-watcher
#
# Type=notify tells systemd to wait for READY=1 before marking the service
# as active. WatchdogSec=900 expects a WATCHDOG=1 heartbeat every 15 minutes
# (poll cycle is 60s, so this gives ~15x margin). If the watcher stops
# sending watchdog pings, systemd will restart it automatically.

[Service]
Type=notify
WatchdogSec=900
