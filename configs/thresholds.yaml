# Skill Optimizer Thresholds
# These thresholds govern accept/reject decisions for candidate mutations.
# All thresholds are conservative by design. Loosen only with evidence.

version: "1.0.0"

# Weighted scoring formula
# total = w_f1*F1 + w_precision*precision + w_recall*recall + w_specificity*(1-FPR) + w_paraphrase*paraphrase_consistency + w_neighbor*(1-neighbor_conflict_rate)
scoring:
  weights:
    f1: 0.30
    precision: 0.20
    recall: 0.15
    specificity: 0.15  # 1 - FPR
    paraphrase_consistency: 0.10
    neighbor_conflict_rate: 0.10  # 1 - conflict_rate

# Hard gates — candidate is rejected if ANY gate fails
hard_gates:
  # Minimum precision floor (by risk level)
  precision_floor:
    low: 0.70
    medium: 0.80
    high: 0.90
    critical: 1.00  # critical skills are frozen anyway

  # Maximum allowed FPR increase from baseline
  fpr_regression_limit: 0.05

  # Maximum allowed neighbor conflict rate
  neighbor_conflict_limit: 0.10

  # Global smoke test: zero tolerance for regressions
  smoke_regression_tolerance: 0

  # Minimum weighted score improvement over baseline to accept
  min_score_improvement: 0.02

  # Maximum description length (chars)
  max_description_length: 1024

# Risk-level overrides
# Higher risk = stricter thresholds
risk_overrides:
  high:
    min_score_improvement: 0.05
    fpr_regression_limit: 0.02
    neighbor_conflict_limit: 0.05

# Anti-broadening guard
anti_broadening:
  # If candidate triggers for >X% more unique queries than baseline, flag it
  trigger_expansion_limit: 0.20
  # If hard negatives pass rate drops, reject
  hard_negative_regression_tolerance: 0

# Batch halt conditions
batch_halt:
  # Stop entire batch if N consecutive skills fail
  max_consecutive_failures: 5
  # Stop if overall acceptance rate drops below this
  min_acceptance_rate: 0.10
  # Maximum wall-clock time per skill (seconds)
  max_time_per_skill: 600
  # Maximum total batch time (seconds)
  max_batch_time: 7200

# Eval parameters (passed to vendored run_eval.py)
eval:
  runs_per_query: 3
  trigger_threshold: 0.5
  timeout_per_query: 30
  num_workers: 10
  holdout_fraction: 0.4
  max_improvement_iterations: 5
