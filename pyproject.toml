[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", "venv", "WORK", "TASKS", "OUTPUT", "LOGS", "MEMORY"]

[tool.ruff.lint]
select = [
    # Existing (8 rule sets)
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort (import sorting) — auto-fixable
    "UP",     # pyupgrade — modernize syntax
    "B",      # flake8-bugbear — common bugs
    "SIM",    # flake8-simplify — simplifications
    "S",      # flake8-bandit — security checks
    # NEW in Phase 7 (7 additional rule sets)
    "ASYNC",  # async rules — detect blocking calls in async functions
    "TC",     # type-checking imports — move typing-only imports to TYPE_CHECKING
    "C90",    # McCabe complexity — flag functions > 15 CC
    "RUF",    # Ruff-specific — mutable defaults, unused noqa, etc.
    "PT",     # pytest style — best practices for test code
    "PERF",   # performance anti-patterns
    "TRY",    # tryceratops — exception handling best practices
]
ignore = [
    "E501",   # line-too-long — handled by formatter
    "E731",   # lambda-assignment — used intentionally in this codebase
    "E741",   # ambiguous-variable-name — false positives on short names
    "SIM105", # suppressible-exception — contextlib.suppress not always clearer
    "SIM108", # if-else-block-instead-of-if-exp — readability preference
    "SIM300", # yoda-conditions — not harmful
    "B011",   # assert-false — used in tests
    "S603",   # subprocess-call — intentional in agent runtime
    "S607",   # start-process-with-partial-path — intentional CLI calls
    "TRY003", # raise-vanilla-args — long messages in exceptions are fine
    "TRY300", # try-consider-else — style preference, too noisy
    "TRY400", # error-instead-of-exception — log.error intentional in this codebase
    "PERF203", # try-except-in-loop — sometimes unavoidable
    "RUF001", # ambiguous-unicode-character-string — intentional em-dashes
    "RUF002", # ambiguous-unicode-character-docstring — intentional em-dashes
    "RUF003", # ambiguous-unicode-character-comment — intentional em-dashes
    "RUF059", # unused-unpacked-variable — too many false positives on `for _, val in`
    "RUF005", # collection-literal-concatenation — [a] + list style is clear enough
    "RUF006", # asyncio-dangling-task — fire-and-forget tasks are intentional
    "RUF015", # unnecessary-iterable-allocation-for-first-element — list()[0] is fine
    "PERF401", # manual-list-comprehension — append-in-loop is often clearer
    "PERF102", # incorrect-dict-iterator — .items() when only keys/values needed
    "TRY004", # prefer-type-error — ValueError used intentionally for args
    "TRY301", # raise-within-try — raise in try is fine for guard clauses
    "TC001",  # typing-only-first-party-import — too aggressive with TYPE_CHECKING moves
    "TC003",  # typing-only-standard-library-import — same
    "PT006",  # parametrize-names-wrong-type — string format "a,b" is standard
    "PT018",  # composite-assertion — compound asserts are fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "PT009", "PT019", "PT017", "PT015", "PT011", "PT027"]  # assert, test tokens, /tmp paths, and pytest style rules are standard in tests
"scripts/**/*.py" = ["S108"]  # temp file usage acceptable in scripts
"nova_kill_switch.py" = ["S108"]  # /tmp sentinel files are the intended kill-switch mechanism
"utils/security_monitor.py" = ["S105", "C901"]  # secret_status variable names are false positives; complex auth failure collection
"tools/runner.py" = ["S105", "E731", "C901", "TRY301", "TRY004", "RUF005"]  # intentional patterns: confirm token, lambda dispatch, complex dispatch, raise-in-try, ValueError for args, list concat
"tools/adapters/system_service.py" = ["S105"]  # _CONFIRM_TOKEN is a confirmation string
"heartbeat.py" = ["C901", "S110", "S310"]  # complex main loop, try-except-pass, urlopen are intentional
"watcher.py" = ["C901", "S110"]  # complex dispatch, try-except-pass for non-fatal ops
"telegram_bot.py" = ["C901", "S110"]  # complex message handler and parse_message
"telegram/parse.py" = ["C901"]  # complex message parsing
"telegram/llm.py" = ["C901"]  # complex response generation
"prompts/heartbeat_prompts.py" = ["C901", "S110"]  # complex state gathering, try-except-pass for resilience
"agents/circuit_breakers.py" = ["S110"]  # try-except-pass for Redis degradation
"agents/observability.py" = ["C901"]  # complex metrics collection
"agents/memory_compactor.py" = ["C901"]  # complex dedup and compaction
"agents/memory_router.py" = ["C901"]  # complex recall routing
"agents/memory_triggers.py" = ["C901"]  # complex anomaly detection
"agents/memory_metrics.py" = ["C901"]  # complex metrics aggregation
"agents/rollout_gate.py" = ["C901"]  # complex evaluation logic
"agents/critic.py" = ["C901"]  # complex review and verification
"agents/workflow_graph.py" = ["C901"]  # complex graph rendering
"agents/policy_engine.py" = ["C901"]  # complex policy fire logic
"agents/production_hardening.py" = ["C901"]  # complex sweep/reconcile logic
"agents/verifier.py" = ["C901"]  # complex validation chains
"tools/mcp_vault_server.py" = ["C901"]  # complex vault write/update validation
"tools/adapters/git_repo.py" = ["C901"]  # complex diff/patch/search
"tools/adapters/repo_files.py" = ["C901"]  # complex repo write
"tools/adapters/repo_search.py" = ["C901"]  # complex search with scoring
"tools/adapters/repo_diff.py" = ["C901"]  # complex diff rendering
"tools/adapters/pdf_generate.py" = ["C901"]  # complex markdown-to-PDF
"tools/contracts.py" = ["C901"]  # complex contract parsing
"tools/orchestrator_adapter.py" = ["C901"]  # complex orchestrator dispatch
"tools/registry.py" = ["C901"]  # complex registry validation
"tools/skill_optimizer/*.py" = ["C901"]  # complex optimization and validation pipelines
"utils/max_plan_guard.py" = ["C901"]  # complex runaway detection
"utils/structured_output.py" = ["C901"]  # complex JSON extraction
"utils/self_healing.py" = ["C901"]  # complex degradation evaluation
"utils/mcp_sanitizer.py" = ["C901"]  # complex sanitization
"utils/testing_mode.py" = ["C901"]  # complex testing cycle
"utils/drift_detector.py" = ["S110"]  # try-except-pass for drift metrics
"utils/langfuse_quality.py" = ["S110"]  # try-except-pass for optional Langfuse
"utils/structured_log.py" = ["S110"]  # try-except-pass for non-critical logging
"schemas/vault_note_schema.py" = ["C901"]  # complex frontmatter validation
"planner/vault_context.py" = ["C901"]  # complex context retrieval
"planner/pattern_promoter.py" = ["C901"]  # complex pattern assessment
"nova-link/api.py" = ["C901"]  # complex dashboard endpoint
"novatrade/**/*.py" = ["C901"]  # complex trading logic (backtest, signals, validation)
"scripts/novatrade_ftmo.py" = ["C901", "S110"]  # complex FTMO review, try-except-pass
"scripts/repair_vault_types.py" = ["C901"]  # complex vault repair
"scripts/md_to_pdf_fpdf.py" = ["C901"]  # complex PDF rendering
"docs/demo_test_run/*.py" = ["C901"]  # complex backtest code

[tool.ruff.lint.mccabe]
max-complexity = 15

# CRITICAL for Pydantic v2 — prevents TC rules from breaking runtime validation
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic.BaseSettings",
]

[tool.ruff.lint.isort]
known-first-party = ["agents", "novatrade", "planner", "telegram", "utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-x -q --tb=short"
timeout = 120
markers = [
    "property: Hypothesis property-based tests",
    "eval: All evaluation tests (deterministic, no LLM required)",
    "eval_llm: LLM-dependent evaluation tests (requires OPENAI_API_KEY)",
    "slow: Tests that take more than 10 seconds to run",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"
no_namespace_packages = true

# Pre-existing type issues in these files — suppress to unblock pre-commit
[[tool.mypy.overrides]]
module = [
    "telegram_bot",
    "telegram.parse",
    "parse",
    "telegram_notifier",
    "agents.rollout_gate",
    "rollout_gate",
    "planner.supervisor",
    "supervisor",
    "tools.task_classifier",
    "task_classifier",
    "api",
    "tools.adapters.repo_search",
    "tools.adapters.git_repo",
    "tools.skill_optimizer.candidate_generator",
    "agents.coordination",
    "agents.workflow_graph",
    "agents.production_hardening",
    "scripts.compliance-report",
    "tests.test_phase7_critic_verifier",
    "tests.test_phase7_integration",
    "tests.test_phase7_failure_simulation",
    "tests.test_phase7_e2e_suite",
    "tests.test_phase9_presentation_layer",
    "tests.test_phase8_working_memory",
    "tests.test_phase10_session_reconstruction",
    "tests.test_ceo_nova_phase1",
    "tests.test_orchestrator",
    "tests.test_runner_audit",
    "tests.test_git_repo",
    "tests.test_contract_retry",
    "tests.test_property_schemas",
    "scripts.complexity_gate",
    "utils.quality_scorer",
]
ignore_errors = true
