<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nova-Link">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/app.css">
  <title>Nova-Link</title>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>Nova-Link</h1>
    <div style="display:flex;align-items:center">
      <span id="status-dot" class="status-dot unknown"></span>
      <span id="status-text" style="font-size:13px;font-weight:600">Loading...</span>
    </div>
  </div>

  <!-- Navigation -->
  <div class="nav">
    <button data-page="dashboard" class="active" onclick="switchPage('dashboard')">Dashboard</button>
    <button data-page="chat" onclick="switchPage('chat')">Chat</button>
    <button data-page="reports" onclick="switchPage('reports')">Reports</button>
    <button data-page="controls" onclick="switchPage('controls')">Controls</button>
  </div>

  <!-- Dashboard Page -->
  <div id="page-dashboard" class="page active">
    <!-- Heartbeat -->
    <div class="card" onclick="loadHealthChecks()">
      <div class="card-title">Heartbeat</div>
      <div class="card-value" id="hb-checks">--/--</div>
      <div class="card-detail">checks passed &middot; <span id="hb-time">--</span></div>
    </div>

    <!-- Health checks (hidden until tapped) -->
    <div class="card" style="display:none">
      <div class="card-title">Health Checks</div>
      <div id="health-checks-detail"></div>
    </div>

    <!-- Tasks -->
    <div class="card">
      <div class="card-title">Task Queue</div>
      <div class="grid-3">
        <div style="text-align:center">
          <div class="card-value" id="tasks-pending">-</div>
          <div class="card-detail">Pending</div>
        </div>
        <div style="text-align:center">
          <div class="card-value" style="color:var(--green)" id="tasks-done">-</div>
          <div class="card-detail">Done</div>
        </div>
        <div style="text-align:center">
          <div class="card-value" style="color:var(--red)" id="tasks-failed">-</div>
          <div class="card-detail">Failed</div>
        </div>
      </div>
    </div>

    <!-- Services -->
    <div class="card">
      <div class="card-title">Services</div>
      <div id="services-list"></div>
    </div>

    <!-- Goals -->
    <div class="card">
      <div class="card-title">Active Goals</div>
      <div id="goals-list"></div>
    </div>

    <!-- Research & Planning -->
    <div class="card">
      <div class="card-title">Last Research Cycle</div>
      <div class="card-detail" id="last-research">--</div>
    </div>
    <div class="card">
      <div class="card-title">Last Planning Cycle</div>
      <div class="card-detail" id="last-planning">--</div>
    </div>
  </div>

  <!-- Chat Page -->
  <div id="page-chat" class="page">
    <div class="chat-container">
      <!-- Voice mode toggle -->
      <div class="chat-mode-bar">
        <button id="mode-text" class="mode-btn active" onclick="setChatMode('text')">Text</button>
        <button id="mode-voice" class="mode-btn" onclick="setChatMode('voice')">Voice</button>
        <button id="voice-settings-btn" class="tts-btn" onclick="toggleVoiceSettings()" title="Voice settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <button id="tts-toggle" class="tts-btn" onclick="toggleTTS()" title="Toggle voice responses">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path id="tts-waves" d="M15.54 8.46a5 5 0 0 1 0 7.07 M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
        </button>
      </div>

      <!-- Voice settings panel -->
      <div id="voice-settings" class="voice-settings" style="display:none">
        <div class="voice-setting-row">
          <label>Voice</label>
          <select id="voice-select" onchange="saveVoiceSetting()"></select>
        </div>
        <div class="voice-setting-row">
          <label>Speed</label>
          <div class="speed-control">
            <input type="range" id="voice-speed" min="0.5" max="2" step="0.1" value="1" oninput="updateSpeedLabel(); saveVoiceSetting()">
            <span id="speed-label">1.0x</span>
          </div>
        </div>
        <div class="voice-setting-row">
          <label>Pitch</label>
          <div class="speed-control">
            <input type="range" id="voice-pitch" min="0.5" max="2" step="0.1" value="1" oninput="updatePitchLabel(); saveVoiceSetting()">
            <span id="pitch-label">1.0x</span>
          </div>
        </div>
        <button class="mode-btn" onclick="testVoice()" style="width:100%;margin-top:8px">Test Voice</button>
      </div>

      <div class="chat-messages" id="chat-messages"></div>

      <!-- Text input mode -->
      <div class="chat-input-bar" id="text-input-bar">
        <input type="text" id="chat-input" placeholder="Message Nova..." autocomplete="off">
        <button onclick="sendChat()">Send</button>
      </div>

      <!-- Voice input mode -->
      <div class="voice-input-bar" id="voice-input-bar" style="display:none">
        <div id="voice-status" class="voice-status">Tap to speak</div>
        <button id="mic-btn" class="mic-btn" onclick="toggleVoice()">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <div id="voice-transcript" class="voice-transcript"></div>
      </div>
    </div>
  </div>

  <!-- Reports Page -->
  <div id="page-reports" class="page">
    <div id="reports-list"></div>
    <div id="report-detail" style="display:none"></div>
  </div>

  <!-- Controls Page -->
  <div id="page-controls" class="page">
    <div class="card">
      <div class="card-title">Services</div>
      <div id="control-services"></div>
    </div>

    <div class="card">
      <div class="card-title">Actions</div>
      <button class="control-btn primary" onclick="triggerHeartbeat()">
        Trigger Heartbeat
      </button>
      <button class="control-btn" onclick="injectTask()">
        Inject Task
      </button>
      <button class="control-btn" onclick="loadDashboard(); switchPage('dashboard'); toast('Refreshed!')">
        Refresh Dashboard
      </button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
